<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panoramaviewer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #canvas-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }
  #canvas-container.dragging {
    cursor: grabbing;
  }
  #canvas-container canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    letter-spacing: 0.02em;
    background: rgba(0,0,0,0.35);
    padding: 8px 16px;
    border-radius: 20px;
    pointer-events: none;
    transition: opacity 0.8s ease;
    white-space: nowrap;
  }
  #hint.hidden {
    opacity: 0;
  }
  #loading {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    background: #000;
    z-index: 10;
    letter-spacing: 0.05em;
  }
  #error {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    background: #000;
    z-index: 11;
    padding: 20px;
    box-sizing: border-box;
    line-height: 1.6;
  }
  #zoom-controls {
    position: fixed;
    top: 18px;
    right: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 5;
  }
  .zoom-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .zoom-btn:active {
    background: rgba(255,255,255,0.2);
  }
  #live-coords {
    position: fixed;
    top: 18px;
    left: 18px;
    background: rgba(0,0,0,0.45);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    z-index: 5;
    display: none;
    pointer-events: none;
    white-space: nowrap;
  }
  #live-coords.visible {
    display: block;
  }
  /* Hotspot markers (used once a scene defines hotspots) */
  .hotspot {
    position: absolute;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    border: 2px solid rgba(0,0,0,0.4);
    box-shadow: 0 0 12px rgba(0,0,0,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #222;
    user-select: none;
    pointer-events: auto;
  }
  .hotspot:hover {
    background: rgba(255,255,255,1);
    transform: scale(1.08);
  }
  /* Info box markers — a separate concept from nav hotspots, with its
     own attributes (title/text) and no scene navigation. */
  .infobox-marker {
    position: absolute;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-radius: 50%;
    background: rgba(40,90,210,0.9);
    border: 2px solid rgba(0,0,0,0.4);
    box-shadow: 0 0 12px rgba(0,0,0,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    font-weight: bold;
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
    user-select: none;
    pointer-events: auto;
  }
  .infobox-marker:hover {
    background: rgba(40,90,210,1);
  }
  .infobox-panel {
    position: absolute;
    max-width: 260px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    padding: 26px 16px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.55;
    text-align: center;
    pointer-events: auto;
    display: none;
    transform: translate(-50%, -50%);
    transform-style: preserve-3d;
    backface-visibility: hidden;
    z-index: 6;
  }
  .infobox-panel.visible {
    display: block;
  }
  .infobox-panel h4 {
    margin: 0 0 6px 0;
    font-size: 15px;
    font-weight: 700;
  }
  .infobox-panel .close-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    cursor: pointer;
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    line-height: 1;
  }
  .infobox-panel .close-btn:hover {
    background: rgba(255,255,255,0.3);
    color: #fff;
  }
  #coord-toast {
    position: fixed;
    left: 50%;
    top: 24px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    z-index: 20;
    display: none;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    white-space: nowrap;
  }
  #coord-toast .hint2 {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
  }
</style>
</head>
<body>

<div id="loading">Laddar panorama…</div>
<div id="error"></div>
<div id="canvas-container"></div>
<div id="hotspot-layer" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:4;"></div>
<div id="infobox-layer" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:4;"></div>
<div id="zoom-controls">
  <div class="zoom-btn" id="zoom-in">+</div>
  <div class="zoom-btn" id="zoom-out">−</div>
  <div class="zoom-btn" id="coords-toggle" title="Visa/dölj lon/lat">◎</div>
</div>
<div id="live-coords"></div>
<div id="hint">Dra för att titta runt · Nyp/scrolla för att zooma</div>
<div id="coord-toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Scene/hotspot definitions live in their own file so they can be
     edited without touching the viewer logic below. The "?v=" query
     string is a cache-buster: it changes on every page load, so
     browsers always fetch the latest scenes.js instead of a cached copy. -->
<script>document.write('<script src="scenes.js?v=' + Date.now() + '"><\/script>');</script>
<script>
let scene, camera, renderer, sphere, currentTexture;
let lon = 0, lat = 0;
let isDragging = false;
let prevX = 0, prevY = 0;
let targetLon = 0, targetLat = 0;
let fov = 90;
const MIN_FOV = 25, MAX_FOV = 100;
let currentSceneId = null;
let currentHotspots = [];
let currentInfoBoxes = [];
let currentHeadingOffset = 0;
let showLiveCoords = false;
const raycaster = new THREE.Raycaster();
let downX = 0, downY = 0;
const CLICK_THRESHOLD = 6; // px of movement below which a pointer down/up counts as a click

init();
loadScene(START_SCENE);
animate();

function init() {
  const container = document.getElementById('canvas-container');

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.1, 1000);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  const geometry = new THREE.SphereGeometry(500, 60, 40);
  geometry.scale(-1, 1, 1); // invert so texture is visible from inside
  sphere = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
  scene.add(sphere);

  container.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  container.addEventListener('touchstart', onTouchStart, { passive: false });
  container.addEventListener('touchmove', onTouchMove, { passive: false });
  container.addEventListener('touchend', onTouchEnd);

  container.addEventListener('wheel', onWheel, { passive: false });

  document.getElementById('zoom-in').addEventListener('click', () => setZoom(fov - 10));
  document.getElementById('zoom-out').addEventListener('click', () => setZoom(fov + 10));
  document.getElementById('coords-toggle').addEventListener('click', toggleLiveCoords);

  window.addEventListener('resize', onResize);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'c' || e.key === 'C') toggleLiveCoords();
  });

  container.addEventListener('mousedown', hideHintOnce, { once: true });
  container.addEventListener('touchstart', hideHintOnce, { once: true });
  setTimeout(() => document.getElementById('hint').classList.add('hidden'), 5000);
}

function loadScene(id, entryLon, entryLat) {
  const def = SCENES[id];
  if (!def) {
    showError('Okänd scen: "' + id + '"');
    return;
  }
  currentSceneId = id;
  currentHotspots = def.hotspots || [];
  currentInfoBoxes = def.infoBoxes || [];
  currentHeadingOffset = def.headingOffset || 0;
  sphere.rotation.y = THREE.MathUtils.degToRad(currentHeadingOffset);
  // A hotspot can override which direction the new scene starts facing
  // (e.g. "arriving from the north" vs "from the south"). Falls back to
  // the scene's own startLon/startLat when no override is given.
  lon = targetLon = (typeof entryLon === 'number') ? entryLon : (def.startLon || 0);
  lat = targetLat = (typeof entryLat === 'number') ? entryLat : (def.startLat || 0);

  document.getElementById('loading').style.display = 'flex';
  document.getElementById('error').style.display = 'none';

  const loader = new THREE.TextureLoader();
  loader.load(
    def.image,
    function (texture) {
      texture.minFilter = THREE.LinearFilter;
      if (currentTexture) currentTexture.dispose();
      currentTexture = texture;
      sphere.material.map = texture;
      sphere.material.needsUpdate = true;
      document.getElementById('loading').style.display = 'none';
      renderHotspots();
      renderInfoBoxes();
    },
    undefined,
    function () {
      document.getElementById('loading').style.display = 'none';
      showError(
        'Kunde inte läsa in panoramabilden "' + def.image + '".<br>' +
        'Kontrollera att bildfilen ligger i samma mapp som denna HTML-fil,<br>' +
        'och att sidan öppnas via en webbserver (inte direkt som fil://).'
      );
    }
  );
}

function showError(msg) {
  const el = document.getElementById('error');
  el.innerHTML = msg;
  el.style.display = 'flex';
}

function hideHintOnce() {
  document.getElementById('hint').classList.add('hidden');
}

function onPointerDown(e) {
  isDragging = true;
  prevX = downX = e.clientX;
  prevY = downY = e.clientY;
  document.getElementById('canvas-container').classList.add('dragging');
}
function onPointerMove(e) {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  prevX = e.clientX;
  prevY = e.clientY;
  applyDrag(dx, dy);
}
function onPointerUp(e) {
  isDragging = false;
  document.getElementById('canvas-container').classList.remove('dragging');
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved < CLICK_THRESHOLD) handleClick(e.clientX, e.clientY);
}

let touchStartDist = null;
let touchStartFov = fov;

function onTouchStart(e) {
  if (e.touches.length === 1) {
    isDragging = true;
    prevX = downX = e.touches[0].clientX;
    prevY = downY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    isDragging = false;
    touchStartDist = getTouchDist(e.touches);
    touchStartFov = fov;
  }
}
function onTouchMove(e) {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - prevX;
    const dy = e.touches[0].clientY - prevY;
    prevX = e.touches[0].clientX;
    prevY = e.touches[0].clientY;
    applyDrag(dx, dy);
  } else if (e.touches.length === 2 && touchStartDist !== null) {
    const dist = getTouchDist(e.touches);
    const scale = touchStartDist / dist;
    setZoom(touchStartFov * scale);
  }
}
function onTouchEnd(e) {
  isDragging = false;
  if (e.touches.length < 2) touchStartDist = null;
  if (e.changedTouches && e.changedTouches.length) {
    const t = e.changedTouches[0];
    const moved = Math.hypot(t.clientX - downX, t.clientY - downY);
    if (moved < CLICK_THRESHOLD) handleClick(t.clientX, t.clientY);
  }
}
function getTouchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function applyDrag(dx, dy) {
  const sensitivity = fov / 15000; // scale sensitivity with zoom level
  targetLon -= dx * sensitivity * 60;
  targetLat += dy * sensitivity * 60;
  targetLat = Math.max(-85, Math.min(85, targetLat));
  // lon is intentionally NOT clamped -> infinite horizontal scroll
}

function onWheel(e) {
  e.preventDefault();
  setZoom(fov + e.deltaY * 0.03);
}

function setZoom(newFov) {
  fov = Math.max(MIN_FOV, Math.min(MAX_FOV, newFov));
  camera.fov = fov;
  camera.updateProjectionMatrix();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// --- Shared photo-anchoring math ---
// Converts a stored (lon, lat) into the marker's current screen position,
// accounting for the scene's headingOffset the same way the sphere mesh
// itself is rotated — so any marker built on this stays glued to the
// same spot in the photo no matter what headingOffset is set to.
// Returns null if the point is currently behind the camera.
function projectPhotoAnchored(lon, lat) {
  const w = window.innerWidth, hgt = window.innerHeight;
  const offsetRad = THREE.MathUtils.degToRad(currentHeadingOffset);
  const cosO = Math.cos(offsetRad), sinO = Math.sin(offsetRad);
  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  // Photo-local position (same frame click-to-log reports lon/lat in).
  const localX = 500 * Math.sin(phi) * Math.cos(theta);
  const localY = 500 * Math.cos(phi);
  const localZ = 500 * Math.sin(phi) * Math.sin(theta);
  const worldX = localX * cosO + localZ * sinO;
  const worldZ = -localX * sinO + localZ * cosO;
  // Compass-style bearing of this point in world space (same convention
  // as the live view lon), used for the "faces you as you circle around
  // it" counter-rotation on info boxes.
  const worldLon = THREE.MathUtils.radToDeg(Math.atan2(worldZ, worldX));
  const pos = new THREE.Vector3(worldX, localY, worldZ);
  const projected = pos.project(camera);
  if (projected.z > 1) return null; // behind the camera
  return {
    x: (projected.x * 0.5 + 0.5) * w,
    y: (-projected.y * 0.5 + 0.5) * hgt,
    worldLon: worldLon
  };
}

// --- Nav hotspots: clickable markers that jump to another scene,
// optionally facing entryLon/entryLat on arrival. Scenes with none
// render nothing. ---
function renderHotspots() {
  const layer = document.getElementById('hotspot-layer');
  layer.innerHTML = '';
  currentHotspots.forEach(function (h) {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.title = h.label || '';
    el.style.pointerEvents = 'auto';
    el.addEventListener('click', function () {
      if (h.target && SCENES[h.target]) loadScene(h.target, h.entryLon, h.entryLat);
    });
    layer.appendChild(el);
    h._el = el;
  });
}

function projectHotspots() {
  if (!currentHotspots.length) return;
  currentHotspots.forEach(function (h) {
    if (!h._el) return;
    const p = projectPhotoAnchored(h.lon, h.lat);
    if (!p) {
      h._el.style.display = 'none';
      return;
    }
    h._el.style.display = 'flex';
    h._el.style.left = p.x + 'px';
    h._el.style.top = p.y + 'px';
  });
}

// --- Info boxes: text panels pinned to a spot in the photo, open by
// default (only the text is shown, no marker). Clicking the close
// button collapses it to a small "i" marker at that same spot, which
// reopens the panel on click. No navigation, no "target" — a separate
// concept from nav hotspots with its own attributes. An optional "tilt"
// (degrees) rotates it around the horizontal axis to make it look laid
// flat against the ground rather than floating upright — e.g. a sign or
// marking attached to the street. It also gently counter-rotates as you
// look around, as if it's a real object at that spot rather than a flat
// screen-space sticker (see projectInfoBoxes). Scenes with none render
// nothing. ---
function renderInfoBoxes() {
  const layer = document.getElementById('infobox-layer');
  layer.innerHTML = '';
  currentInfoBoxes.forEach(function (b) {
    b._tilt = b.tilt || 0;

    const el = document.createElement('div');
    el.className = 'infobox-marker';
    el.textContent = 'i';
    el.title = b.title || '';

    const panel = document.createElement('div');
    panel.className = 'infobox-panel';
    panel.innerHTML =
      (b.title ? '<h4>' + b.title + '</h4>' : '') +
      '<span class="close-btn">✕</span>' +
      '<div>' + (b.text || '') + '</div>';
    panel.querySelector('.close-btn').addEventListener('click', function (e) {
      e.stopPropagation();
      b._open = false;
    });

    el.addEventListener('click', function () {
      b._open = !b._open;
    });

    layer.appendChild(el);
    layer.appendChild(panel);
    b._el = el;
    b._panel = panel;
    // Open by default. This is the user's actual preference for the
    // panel; whether it's currently ON SCREEN (facing that direction)
    // is a separate, transient concern handled in projectInfoBoxes —
    // being briefly off-screen must never reset this back to closed.
    b._open = true;
  });
}

// How far the box turns to "face" you as you circle away from it,
// capped so it never flips edge-on or reverses. Degrees.
const INFOBOX_MAX_COUNTER_ROTATE = 35;

function projectInfoBoxes() {
  if (!currentInfoBoxes.length) return;
  currentInfoBoxes.forEach(function (b) {
    if (!b._el) return;
    const p = projectPhotoAnchored(b.lon, b.lat);
    if (!p) {
      b._el.style.display = 'none';
      b._panel.classList.remove('visible');
      return;
    }
    // The box's compass bearing minus your current view direction: 0
    // when you're looking straight at it (shown flat-on), growing as
    // you turn away — this is what makes it appear to rotate opposite
    // to your own movement, like a real object fixed at that spot.
    let diff = p.worldLon - lon;
    diff = ((diff + 180) % 360 + 360) % 360 - 180; // normalize to -180..180
    const counterRotate = THREE.MathUtils.clamp(-diff, -INFOBOX_MAX_COUNTER_ROTATE, INFOBOX_MAX_COUNTER_ROTATE);
    const rotation = ' perspective(500px) rotateY(' + counterRotate.toFixed(1) + 'deg) rotateX(' + b._tilt + 'deg)';

    b._el.style.transform = rotation;
    b._panel.style.transform = 'translate(-50%, -50%)' + rotation;

    // Marker and panel are mutually exclusive, both centered on the
    // exact same anchored point: open shows just the text panel there,
    // closed shows just the small "i" marker in its place.
    b._el.style.display = b._open ? 'none' : 'flex';
    b._el.style.left = p.x + 'px';
    b._el.style.top = p.y + 'px';

    b._panel.classList.toggle('visible', b._open);
    b._panel.style.left = p.x + 'px';
    b._panel.style.top = p.y + 'px';
  });
}

// --- Click-to-log: click anywhere on the panorama to get its lon/lat,
// for building the "hotspots" list of a scene. ---
function handleClick(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((clientX - rect.left) / rect.width) * 2 - 1,
    -((clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(sphere);
  if (!hits.length) return;

  const p = hits[0].point;
  // p is in world space, which includes the scene's headingOffset
  // rotation (sphere.rotation.y). Undo that rotation so the logged
  // lon/lat is in the same "tour space" used by hotspots and startLon,
  // regardless of how this particular photo happens to be rotated.
  const offsetRad = THREE.MathUtils.degToRad(currentHeadingOffset);
  const cosO = Math.cos(offsetRad), sinO = Math.sin(offsetRad);
  const tx = p.x * cosO - p.z * sinO;
  const ty = p.y;
  const tz = p.x * sinO + p.z * cosO;
  const r = Math.sqrt(tx * tx + ty * ty + tz * tz);
  const phi = Math.acos(THREE.MathUtils.clamp(ty / r, -1, 1));
  let lonDeg = THREE.MathUtils.radToDeg(Math.atan2(tz, tx));
  if (lonDeg < 0) lonDeg += 360;
  const latDeg = 90 - THREE.MathUtils.radToDeg(phi);

  const snippet = '{ lon: ' + lonDeg.toFixed(1) + ', lat: ' + latDeg.toFixed(1) + ', label: "", target: "" }';
  console.log('[hotspot]', snippet);
  showCoordToast(snippet);
}

function showCoordToast(text) {
  const el = document.getElementById('coord-toast');
  el.innerHTML = text + '<div class="hint2">Loggat i konsolen · klicka för att kopiera</div>';
  el.style.display = 'block';
  el.onclick = function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () {});
    }
    el.querySelector('.hint2').textContent = 'Kopierat!';
  };
  clearTimeout(showCoordToast._t);
  showCoordToast._t = setTimeout(function () {
    el.style.display = 'none';
  }, 6000);
}

function animate() {
  requestAnimationFrame(animate);

  lon += (targetLon - lon) * 0.12;
  lat += (targetLat - lat) * 0.12;

  if (lon > 360) { lon -= 360; targetLon -= 360; }
  if (lon < -360) { lon += 360; targetLon += 360; }

  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);

  const target = new THREE.Vector3();
  target.x = 500 * Math.sin(phi) * Math.cos(theta);
  target.y = 500 * Math.cos(phi);
  target.z = 500 * Math.sin(phi) * Math.sin(theta);

  camera.lookAt(target);
  renderer.render(scene, camera);
  projectHotspots();
  projectInfoBoxes();
  updateLiveCoords();
}

function toggleLiveCoords() {
  showLiveCoords = !showLiveCoords;
  document.getElementById('live-coords').classList.toggle('visible', showLiveCoords);
}

function updateLiveCoords() {
  if (!showLiveCoords) return;
  let displayLon = lon % 360;
  if (displayLon < 0) displayLon += 360;
  document.getElementById('live-coords').innerHTML =
    'lon: ' + displayLon.toFixed(1) + '<br>lat: ' + lat.toFixed(1);
}
</script>
</body>
