<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>__TITLE__</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #grid {
    display: grid;
    position: fixed;
    top: 0;
    left: 0;
    /* Fallback for the first paint before JS runs; on mobile this is
       overridden with an exact pixel size from the visual viewport, since
       100vh on phones measures the screen with the address bar hidden and
       overflows past what's actually visible. */
    width: 100vw;
    height: 100vh;
    gap: 2px;
    background: #000;
  }
  #grid .cell {
    position: relative;
    overflow: hidden;
    background: #111;
  }
  #grid .cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  #overlay {
    /* Size/position is set in JS to exactly match #grid's phone-shaped
       viewport rect (see PHONE_ASPECT below) rather than the full browser
       window, so a magnified portrait photo fills it instead of leaving
       black letterboxing on the sides. */
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
  }
  #overlay img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }
  #overlay.active {
    display: flex;
  }
  #hint {
    /* A distinct box centered on top of the photo, not a banner tucked at
       an edge or a subtle pill — feedback was that both of those were too
       easy to miss against a photo. Solid background + border, deliberately
       not blended into whatever image is behind it. */
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(90%, 420px);
    box-sizing: border-box;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    line-height: 1.45;
    padding: 20px 24px;
    border-radius: 16px;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.65);
    pointer-events: none;
    z-index: 300;
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  #hint.hidden {
    opacity: 0;
  }
</style>
</head>
<body>

<div id="grid"></div>

<div id="overlay">
  <img id="overlay-img" src="" alt="">
</div>

<div id="hint">Press &amp; drag a photo to preview it</div>

<script>
  // File list is injected by generate_contact_sheet.py
  const files = __FILES_JSON__;

  // Fisher-Yates shuffle, re-randomized on every page load
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  const order = shuffle(files.slice());
  const grid = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const overlayImg = document.getElementById('overlay-img');

  order.forEach(name => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const img = document.createElement('img');
    img.src = name;
    img.dataset.src = name;
    img.loading = 'eager';
    img.draggable = false;
    cell.appendChild(img);
    grid.appendChild(cell);
  });

  // Photos are typically shot in portrait on a phone. On a desktop browser
  // the window is usually landscape, which — if the layout used the full
  // window — would surround every magnified photo with black letterboxing.
  // Instead, the whole page is confined to a portrait, phone-shaped rect
  // (contain-fit inside the actual window, centered) so photos fill it
  // properly regardless of how wide the browser window is.
  //
  // The ratio is the *visible* mobile browser viewport, not the raw device
  // screen. A phone's screen is ~9:19.5, but the address bar and bottom
  // toolbar/home-indicator crop that down in practice — what a mobile
  // visitor actually sees (and what this page already sizes itself to on a
  // real phone, via visualViewport) is closer to ~9:16. Using the true
  // device ratio here would simulate a taller rect than real phones
  // actually show, leaving more unused space on desktop than necessary.
  const PHONE_ASPECT = 9 / 16; // width / height, ~visible mobile viewport

  // Compute the column/row layout that maximizes thumbnail size while
  // fitting all images on screen with no scrolling. Sized from the visual
  // viewport (not CSS vh units) because mobile Safari's 100vh measures the
  // page as if the address bar were hidden, which overflows the actually
  // visible area and pushes the bottom rows off-screen with no way to
  // scroll to them.
  function layoutGrid() {
    const n = order.length;
    const vv = window.visualViewport;
    const winW = vv ? vv.width : window.innerWidth;
    const winH = vv ? vv.height : window.innerHeight;

    let w = winW, h = w / PHONE_ASPECT;
    if (h > winH) { h = winH; w = h * PHONE_ASPECT; }
    const left = (winW - w) / 2;
    const top = (winH - h) / 2;

    grid.style.width = w + 'px';
    grid.style.height = h + 'px';
    grid.style.left = left + 'px';
    grid.style.top = top + 'px';
    overlay.style.width = w + 'px';
    overlay.style.height = h + 'px';
    overlay.style.left = left + 'px';
    overlay.style.top = top + 'px';

    let bestCols = 1;
    let bestScore = -1;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const cellW = w / cols;
      const cellH = h / rows;
      const score = Math.min(cellW, cellH);
      if (score > bestScore) {
        bestScore = score;
        bestCols = cols;
      }
    }
    const rows = Math.ceil(n / bestCols);
    grid.style.gridTemplateColumns = `repeat(${bestCols}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  }

  layoutGrid();
  window.addEventListener('resize', layoutGrid);
  window.addEventListener('orientationchange', layoutGrid);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', layoutGrid);
  }

  // The grid of thumbnails needs to actually be visible on load — showing
  // a starting image here (via the overlay, which covers the whole grid)
  // was tried, but it meant the very first thing a new visitor saw was one
  // static photo with no sign there was a grid underneath at all, which
  // made the hint below ("let go to see all photos") make no sense: there
  // was nothing to "let go" of yet. So the overlay stays inactive until the
  // user actually presses on a thumbnail, same as the original design.
  //
  // First-time users still have no visual cue that the grid is interactive
  // at all, though, so a brief hint spells out the gesture. It stays up
  // until the user actually succeeds at previewing a photo — not merely
  // touching the screen, since a press that hasn't shown anything yet
  // hasn't taught them anything — with a timeout as a fallback for anyone
  // who never interacts at all.
  const hint = document.getElementById('hint');
  const hintTimer = setTimeout(() => hint.classList.add('hidden'), 5000);
  function dismissHint() {
    clearTimeout(hintTimer);
    hint.classList.add('hidden');
  }

  // Shared trigger: show the enlarged image under a given point.
  function showAt(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return;
    const cell = el.closest('.cell');
    const img = cell ? cell.querySelector('img') : null;
    if (img) {
      overlayImg.src = img.dataset.src;
      overlay.classList.add('active');
      dismissHint();
    }
  }

  function hideOverlay() {
    overlay.classList.remove('active');
  }

  // Pointer Events unify touch and mouse (and pen) so the same press-and-drag
  // gesture works identically on both: press down on a thumbnail to enlarge
  // it, drag across the grid to preview whatever is under the pointer, and
  // release to reveal the contact sheet again.
  let dragging = false;

  grid.addEventListener('pointerdown', e => {
    dragging = true;
    grid.setPointerCapture(e.pointerId);
    showAt(e.clientX, e.clientY);
  });

  grid.addEventListener('pointermove', e => {
    if (dragging) showAt(e.clientX, e.clientY);
  });

  grid.addEventListener('pointerup', () => {
    dragging = false;
    hideOverlay();
  });

  grid.addEventListener('pointercancel', () => {
    dragging = false;
    hideOverlay();
  });
</script>

</body>
</html>
